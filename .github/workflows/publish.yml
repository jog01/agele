name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, ws, worker, feed]
    # Serialize runs for one commit so two runs cannot both see a tag as missing.
    concurrency:
      group: publish-${{ matrix.target }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # A rerun must not replace an image that is already published under this tag.
      - id: exists
        run: |
          if out=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ steps.tag.outputs.sha }}" 2>&1); then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE "not found|denied|forbidden|unauthorized" <<<"$out"; then  # missing tag, or package not created yet (a real auth failure fails the push too)
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"; exit 1
          fi
      # Tags never move; jog01/agele-infra pins image.backendTag to sha-<commit>.
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.published == 'false'
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
