services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fomo
      POSTGRES_PASSWORD: fomo
      POSTGRES_DB: fomo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Traces UI at http://localhost:16686; OTLP HTTP on 4318.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]
    profiles: [observability]

  api:
    build:
      context: .
      target: api
    profiles: [apps]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://fomo:fomo@postgres:5432/fomo
      REDIS_URL: redis://redis:6379
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["4000:4000"]

  ws:
    build:
      context: .
      target: ws
    profiles: [apps]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://fomo:fomo@postgres:5432/fomo
      REDIS_URL: redis://redis:6379
      WS_PORT: 4001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["4001:4001"]

  worker:
    build:
      context: .
      target: worker
    profiles: [apps]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://fomo:fomo@postgres:5432/fomo
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  feed:
    build:
      context: .
      target: feed
    profiles: [apps]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://fomo:fomo@postgres:5432/fomo
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
