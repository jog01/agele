services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fomo
      POSTGRES_PASSWORD: fomo
      POSTGRES_DB: fomo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Traces UI at http://localhost:16686; OTLP HTTP on 4318.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]
    profiles: [observability]

volumes:
  pgdata:
